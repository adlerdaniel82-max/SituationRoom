server {
    listen      217.154.173.133:443 ssl;
    http2 on;
    server_name situation.schnueddels.de ;
    root        /home/webuser/web/situation.schnueddels.de/public_html;

    ssl_certificate      /home/webuser/conf/web/situation.schnueddels.de/ssl/situation.schnueddels.de.pem;
    ssl_certificate_key  /home/webuser/conf/web/situation.schnueddels.de/ssl/situation.schnueddels.de.key;
    include /home/webuser/conf/web/situation.schnueddels.de/nginx.hsts.conf*;

    index index.html;

    location ~* \.(html|php)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Strict-Transport-Security "max-age=31536000;" always;
        expires off;
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000;" always;
    }

    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000;" always;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_redirect off;
    }

    location ^~ /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_redirect off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 403 /document_errors/403.html;
    error_page 404 /document_errors/404.html;
    error_page 410 /document_errors/410.html;
    error_page 500 502 503 504 /document_errors/50x.html;

    location /document_errors/ {
        alias /home/webuser/web/situation.schnueddels.de/document_errors/;
        internal;
    }

    include /home/webuser/conf/web/situation.schnueddels.de/nginx.ssl.conf_letsencrypt;
}
